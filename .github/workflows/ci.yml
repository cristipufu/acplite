name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest }
          - { os: windows-latest }
          - { os: macos-latest }

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Restore
        run: dotnet restore -p:NuGetAuditMode=all -p:TreatWarningsAsErrors=true

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Unit and integration tests
        run: dotnet test test/Acplite.Tests -c Release --no-build --logger "trx;LogFileName=tests.trx" --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: TestResults

  native-aot:
    name: NativeAOT (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,    rid: linux-x64,   exe: '' }
          - { os: ubuntu-24.04-arm, rid: linux-arm64, exe: '' }
          - { os: windows-latest,   rid: win-x64,     exe: '.exe' }
          - { os: macos-15-intel,   rid: osx-x64,     exe: '' }
          - { os: macos-latest,     rid: osx-arm64,   exe: '' }

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Publish the CLI with NativeAOT
        run: dotnet publish src/Acplite.Client -c Release -r ${{ matrix.rid }} -p:PublishAot=true -p:InvariantGlobalization=true -o aot

      - name: Smoke test the NativeAOT binary
        shell: bash
        run: ./aot/Acplite.Client${{ matrix.exe }} --help
